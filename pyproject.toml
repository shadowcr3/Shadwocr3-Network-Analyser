[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcr3-na"
version = "0.1.0"
description = "Network discovery and analysis for networks you own or are authorised to assess"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shadowcr3" }]
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff", "mypy", "types-defusedxml", "pyinstaller>=6"]

[project.scripts]
shadowcr3-na = "shadowcr3_na.cli:main"

[project.gui-scripts]
shadowcr3-na-gui = "shadowcr3_na.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "ISC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.10"
